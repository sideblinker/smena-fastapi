{% if report.days %}<div class="table-wrap"><table class="data-table"><thead><tr><th>Дата</th><th>Отработано</th><th>Перерывы</th></tr></thead><tbody>{% for day in report.days %}<tr><td>{{ day.date }}</td><td class="table-duration">{{ fmt.readable(day.workMs) }}</td><td>{{ fmt.readable(day.breakMs) }}</td></tr>{% endfor %}</tbody></table></div>{% else %}{{ empty('Нет данных', 'Выберите другой период.') }}{% endif %}
