{% set first = fmt.local_datetime(calendar.month ~ '-01').weekday() %}
{% for blank in range(first) %}<span class="calendar-spacer" aria-hidden="true"></span>{% endfor %}
{% for day in calendar.days %}
<button type="button" class="calendar-day {{ 'is-absence' if day.kind == 'absence' else 'is-day-off' if day.kind == 'day_off' else '' }}{% if day.date == today %} is-today{% endif %}{% if day.workMs %} has-work{% endif %}{% if day.state in ['working','break'] %} is-active{% endif %}" data-action="calendar-day" data-date="{{ day.date }}" aria-label="{{ day.date }}. {{ fmt.day_label(day) }}. План {{ fmt.readable(day.plannedMs) }}. Факт {{ fmt.readable(day.workMs) }}"{% if day.date == today %} aria-current="date"{% endif %}>
<span class="calendar-day-top"><span class="calendar-day-number">{{ day.date[-2:]|int }}</span>{% if day.date == today %}<span class="calendar-today-label">Сегодня</span>{% endif %}</span><span class="calendar-day-status">{{ fmt.day_label(day) }}</span><span class="calendar-day-fact">{{ fmt.hours_number(day.workMs) ~ ' ч' if day.workMs else '—' }}</span><span class="calendar-day-plan">{{ 'план ' ~ fmt.hours_number(day.plannedMs) ~ ' ч' if day.plannedMs else 'без плана' }}</span><span class="calendar-day-flags">{% if day.lateMs %}<i class="day-flag late" title="Опоздание">!</i>{% endif %}{% if day.overtimeMs %}<i class="day-flag extra" title="Сверх плана">+</i>{% endif %}</span></button>
{% endfor %}
{% for blank in range((7 - (first + calendar.days|length) % 7) % 7) %}<span class="calendar-spacer" aria-hidden="true"></span>{% endfor %}
